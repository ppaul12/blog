<!DOCTYPE html>
<html lang="{{ page.lang | default: 'zh' }}" data-theme="dark">
    {%- include head.html -%}
    <body{% if page.page_width %} class="page-width-{{ page.page_width | escape }}"{% endif %}>
        {%- include navigation.html -%}

        <main>{{ content }}</main>

        {%- unless page.required contains "no-footer" -%}
        <footer>
            <small>by {{ site.data.profiles.author.name }} with <i class="fa-solid fa-heart fa-fw faa-pulse faa-slow animated"></i></small><br>
            <small><i class="fa-regular fa-copyright fa-fw"></i> 2021 - {{ "now" | date:"%Y" }}</small><br>
            <small id="site-view"></small>
        </footer>
        {%- endunless -%}
    </body>
</html>
