<!DOCTYPE html>
<html lang="{{ page.lang | default: 'zh' }}"
    data-palette="{{ site.data.appearance.palette | escape }}"
    data-mode="{{ site.data.appearance.mode }}"
    data-theme="{% if site.data.appearance.mode == 'dark' %}dark{% else %}light{% endif %}"
>
    {%- include head.html -%}
    <body{% if page.page_width %} class="page-width-{{ page.page_width | escape }}"{% endif %}>
        {%- include navigation.html -%}

        <main>{{ content }}</main>

        {%- unless page.required contains "no-footer" -%}
        <footer>
            <small id="site-view"></small><br>
            <small>
                {{ site.appearance.palette | replace:"-"," " | capitalize }},
                by {{ site.data.profiles.author.name }} with <i class="fa-solid fa-heart fa-fw faa-pulse faa-slow animated"></i>
            </small><br>
            <small><i class="fa-regular fa-copyright fa-fw"></i> 2021 - {{ "now" | date:"%Y" }}</small>
        </footer>
        {%- endunless -%}
    </body>
</html>
