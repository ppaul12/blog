---
layout: default
---

<article>
    <header class="card page-header">
        <hgroup>
            <h1 class="page-header-title">{{ page.title | capitalize | escape }}</h1>
            <div class="page-header-ornament" aria-hidden="true">✦</div>
            {%- if page.subtitle -%}
            <p class="page-header-subtitle">{{ page.subtitle | upcase | escape }}</p>
            {%- endif -%}
        </hgroup>
    </header>

    {{ content }}

    <footer class="card">{%- include comment.html -%}</footer>
</article>
