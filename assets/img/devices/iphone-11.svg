<svg xmlns="http://www.w3.org/2000/svg" id="phone-dual-animated" width="1600" height="1440" viewBox="0 0 1600 1440" role="img" aria-labelledby="phone-dual-animated-title phone-dual-animated-desc">
  <title id="phone-dual-animated-title">iPhone 11</title>
  <style>
#phone-dual-animated { color: var(--device-line-color, #111); }
@media (prefers-color-scheme: dark) {
  #phone-dual-animated { color: var(--device-line-color, #eee); }
}
#phone-dual-animated .outline, #phone-dual-animated .detail { fill: none; stroke: currentColor; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
#phone-dual-animated .rear { transform: translateX(-200px); animation: phone-dual-animated-unfold-rear 1.8s ease-in-out both; }
#phone-dual-animated .front { transform: translateX(200px); animation: phone-dual-animated-unfold-front 1.8s ease-in-out both; }
@keyframes phone-dual-animated-unfold-rear {
  from { transform: translateX(200px); }
  to { transform: translateX(-200px); }
}
@keyframes phone-dual-animated-unfold-front {
  from { transform: translateX(-200px); }
  to { transform: translateX(200px); }
}
@media (prefers-reduced-motion: reduce) {
  #phone-dual-animated .rear, #phone-dual-animated .front { animation: none; }
}
  /* Only device silhouettes are filled; the canvas stays transparent. */
#phone-dual-animated .device-body { fill: var(--device-background-color, #fff); }
@media (prefers-color-scheme: dark) {
  #phone-dual-animated .device-body { fill: var(--device-background-color, #1b1e23); }
}
</style>
