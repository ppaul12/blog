<svg xmlns="http://www.w3.org/2000/svg" id="phone-triple-animated" width="1600" height="1440" viewBox="0 0 1600 1440" role="img" aria-labelledby="phone-triple-animated-title phone-triple-animated-desc">
  <title id="phone-triple-animated-title">iPhone 16 Pro</title>
  <style>
#phone-triple-animated { color: var(--device-line-color, #111); }
@media (prefers-color-scheme: dark) {
  #phone-triple-animated { color: var(--device-line-color, #eee); }
}
#phone-triple-animated .outline, #phone-triple-animated .detail { fill: none; stroke: currentColor; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
#phone-triple-animated .rear { transform: translateX(-200px); animation: phone-triple-animated-unfold-rear 1.8s ease-in-out both; }
#phone-triple-animated .front { transform: translateX(200px); animation: phone-triple-animated-unfold-front 1.8s ease-in-out both; }
@keyframes phone-triple-animated-unfold-rear {
  from { transform: translateX(200px); }
  to { transform: translateX(-200px); }
}
@keyframes phone-triple-animated-unfold-front {
  from { transform: translateX(-200px); }
  to { transform: translateX(200px); }
}
@media (prefers-reduced-motion: reduce) {
  #phone-triple-animated .rear, #phone-triple-animated .front { animation: none; }
}
  /* Only device silhouettes are filled; the canvas stays transparent. */
#phone-triple-animated .device-body { fill: var(--device-background-color, #fff); }
@media (prefers-color-scheme: dark) {
  #phone-triple-animated .device-body { fill: var(--device-background-color, #1b1e23); }
}
</style>
