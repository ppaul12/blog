<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Shared viewfinder and six distinct metering patterns, drawn on a 32 × 24 grid. -->
  <defs>
    <path id="viewfinder" d="M9 3H3v6m20-6h6v6M3 15v6h6m20-6v6h-6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>
  <symbol id="average" viewBox="0 0 32 24">
    <use href="#viewfinder"/>
    <path d="M8 8h16M8 12h16M8 16h16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  </symbol>
  <symbol id="center-weighted" viewBox="0 0 32 24">
    <use href="#viewfinder"/>
    <ellipse cx="16" cy="12" rx="9" ry="7" fill="none" stroke="currentColor" stroke-width="1.25" opacity=".55"/>
    <circle cx="16" cy="12" r="4" fill="currentColor"/>
  </symbol>
  <symbol id="spot" viewBox="0 0 32 24">
    <use href="#viewfinder"/>
    <circle cx="16" cy="12" r="2" fill="currentColor"/>
  </symbol>
  <symbol id="multi-spot" viewBox="0 0 32 24">
    <use href="#viewfinder"/>
    <g fill="currentColor">
      <circle cx="10" cy="9" r="2"/>
      <circle cx="22" cy="9" r="2"/>
      <circle cx="16" cy="16" r="2"/>
    </g>
  </symbol>
  <symbol id="multi-segment" viewBox="0 0 32 24">
    <use href="#viewfinder"/>
    <g fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round">
      <path d="M7 6h18v12H7zM13 6v12m6-12v12M7 10h18M7 14h18"/>
    </g>
    <path d="M13 10h6v4h-6z" fill="currentColor"/>
  </symbol>
  <symbol id="partial" viewBox="0 0 32 24">
    <use href="#viewfinder"/>
    <circle cx="16" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="1.75"/>
  </symbol>
</svg>
