---
layout: page
page_width: wide
title: album
subtitle: recall the old memories ...
permalink: /album
required: album
---

<div class="collection-album">
    <nav class="collection-album-toolbar" aria-label="Album navigation">
        <p id="collection-album-count" class="collection-album-count" aria-live="polite">Loading album…</p>
        <fieldset class="collection-album-order-group">
            <legend class="visually-hidden">Photo order</legend>
            <label class="collection-album-order-option" title="Random order">
                <input type="radio" name="collection-album-order" value="shuffle" aria-label="Random order">
                <span class="collection-album-order-icon"><i class="fa-solid fa-shuffle fa-fw" aria-hidden="true"></i></span>
            </label>
            <label class="collection-album-order-option" title="Oldest first">
                <input type="radio" name="collection-album-order" value="ascend" aria-label="Oldest first">
                <span class="collection-album-order-icon"><i class="fa-solid fa-arrow-down-1-9 fa-fw" aria-hidden="true"></i></span>
            </label>
            <label class="collection-album-order-option" title="Newest first">
                <input type="radio" name="collection-album-order" value="descend" aria-label="Newest first">
                <span class="collection-album-order-icon"><i class="fa-solid fa-arrow-up-1-9 fa-fw" aria-hidden="true"></i></span>
            </label>
        </fieldset>
    </nav>
    <div id="collection-album" class="album-grid" aria-live="polite" aria-busy="true"></div>
</div>
<script>
    initCollectionAlbum("collection-album", "{% link assets/json/album.json %}", {{ site.baseurl | default: '' | jsonify }})
</script>
